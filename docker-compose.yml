# ============================================================================
# EntegreFlow — Coolify production compose.
#
# TOPOLOGY (deploy the Coolify way, not k8s):
#   api  + web      → separate Coolify *Applications* (build from Dockerfile.api
#                     / Dockerfile.web). Coolify gives them rolling deploys +
#                     health gating + Traefik TLS/routing. NOT in this compose.
#   postgres + redis → Coolify *managed resources* (scheduled backups + UI
#                     restore). Injected here as DATABASE_URL / REDIS_URL.
#   worker + minio   → defined here (internal only, never Traefik-exposed).
#
# Migrations run as a Coolify PRE-DEPLOY hook, not here:
#   pnpm --filter @entegreflow/db migrate   (advisory-locked, forward-only)
#
# Do NOT add traefik.* labels — Coolify manages routing for the Applications.
# ============================================================================
name: entegreflow

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      APP_ENCRYPTION_KEY_ID: ${APP_ENCRYPTION_KEY_ID:-kek-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-entegreflow}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKER_HEALTH_PORT: "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  miniodata:
